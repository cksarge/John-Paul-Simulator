<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password · John-Paul Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/+esm"
    }
  }
  </script>
  <style>
    .reset-wrap { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; overflow-y: auto; }
    .reset-card { width: min(420px, 100%); display: flex; flex-direction: column; gap: 14px; }
    .reset-card .logo { text-align: center; margin-bottom: 4px; }
    .strength { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
    .strength div { height: 100%; width: 0; transition: width .2s, background .2s; }
    .state-icon { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto; font-size: 28px; font-weight: 700; }
    .state-icon.ok { background: rgba(89,211,138,.15); color: var(--good); }
    .state-icon.bad { background: rgba(255,90,90,.15); color: var(--bad); }
  </style>
</head>
<body>
  <div class="menu-bg" style="position:fixed"></div>
  <div class="reset-wrap">
    <div class="panel reset-card" id="card">
      <div class="logo">JOHN-PAUL <span>SIMULATOR</span></div>
      <div class="queue-pulse"></div>
      <p class="muted" style="text-align:center;margin:0">Verifying your reset link…</p>
    </div>
  </div>
  <script type="module" src="js/reset.js"></script>
</body>
</html>
